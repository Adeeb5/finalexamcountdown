<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Finals+</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <style>
        :root {
            --indigo: #3f51b5;
            --purple: #5640a6;
            --royal: #36266c;
            --ink: #1f2433;
            --muted: #5f5870;
            --soft: #f4f2fa;
            --surface: #ffffff;
            --font-display: "SF Pro Display", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --font-text: "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body.dark-mode {
            --surface: #0b0e14;
            --ink: #f4f2fa;
            --soft: #1d222e;
            --muted: #958ea3;
            --indigo: #788bfc;
            --purple: #9a8bfc;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--surface);
            font-family: var(--font-text);
            display: grid;
            place-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }

        .container {
            max-width: 480px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-code {
            font-family: var(--font-display);
            font-size: clamp(96px, 15vw, 144px);
            font-weight: 800;
            line-height: 1;
            margin: 0;
            background: linear-gradient(135deg, var(--indigo), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            margin: 12px 0 16px;
        }

        p {
            color: var(--muted);
            font-size: 16px;
            line-height: 1.5;
            margin: 0 0 32px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 12px 28px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: #fff;
            background: var(--indigo);
            transition: transform 160ms ease, background 160ms ease;
            box-shadow: rgba(63, 81, 181, 0.24) 0 8px 24px;
        }

        .pill:hover {
            background: var(--purple);
        }

        .pill:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Lost in preparation?</h1>
        <p>The page you are looking for doesn't exist. Check the URL or head back home to track your final exams.</p>
        <a href="/" class="pill">Back to Finals+</a>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
