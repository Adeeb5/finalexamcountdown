<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://simsweb.uitm.edu.my https://uitmtimetable.com; font-src 'self' data:;">
    <title>Finals+ AI | Chat Study Assistant</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" integrity="sha384-toVdrLSMaw7Y55MowcKqkmFL/Ek6Sky62NOk0b5sDDZBu2wcoPyyQUt9unDVjXhL"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" integrity="sha384-uTYyvsSSUZeaPhb5RbKlQa0zY/WpX/QHfvg2mczXyBQOpkWPEDy9lczyp+w7SKXu"></script>
    <style>
        :root {
            --indigo: #3f51b5;
            --purple: #5640a6;
            --royal: #36266c;
            --navy: #20356b;
            --gold: #ffc94e;
            --ink: #1f2433;
            --muted: #5f5870;
            --soft: #f4f2fa;
            --surface: #ffffff;
            --surface-card: #f9f9fb;
            --ink-lead: #342d48;
            --line: rgba(31, 36, 51, 0.08);
            --danger: #b42318;
            --success: #067647;
            --font-display: "SF Pro Display", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --font-text: "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body.dark-mode {
            --surface: #0b0e14;
            --surface-card: #151922;
            --ink: #f4f2fa;
            --soft: #1d222e;
            --muted: #958ea3;
            --line: rgba(255, 255, 255, 0.08);
            --indigo: #788bfc;
            --purple: #9a8bfc;
            --ink-lead: #d0c9e3;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--surface);
            font-family: var(--font-text);
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        button, input, textarea, a { font: inherit; }
        button:disabled { cursor: wait; opacity: 0.7; }
        a { color: inherit; text-decoration: none; }

        /* Main ChatGPT-like Layout */
        .chat-app {
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background: var(--surface-card);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
            transition: transform 0.25s ease-in-out;
            z-index: 10;
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 700;
            font-family: var(--font-display);
        }

        .sidebar-brand img {
            height: 24px;
        }

        .new-chat-btn {
            margin: 16px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 150ms ease, border-color 150ms ease;
        }
        .new-chat-btn:hover {
            background: var(--soft);
            border-color: var(--indigo);
        }

        /* Saved Exams Widget inside Sidebar */
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            font-weight: 700;
            margin: 8px 0;
        }

        .sidebar-exam-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-exam-card {
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 13px;
        }

        .sidebar-exam-code {
            font-weight: 700;
            color: var(--indigo);
            margin: 0 0 2px;
        }

        .sidebar-exam-date {
            color: var(--muted);
            font-size: 11px;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-link {
            padding: 10px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: background 150ms ease;
        }
        .sidebar-link:hover {
            background: var(--soft);
        }

        /* Main Chat Area Container */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--surface);
            overflow: hidden;
        }

        /* Top bar for mobile toggle and theme button */
        .chat-topbar {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-toggle, .theme-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--ink);
            padding: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-toggle:hover, .theme-btn:hover {
            background: var(--soft);
        }

        .menu-toggle {
            display: none; /* Only show on mobile */
        }

        /* Chat Scroll Feed */
        .chat-feed-wrapper {
            flex: 1;
            overflow-y: auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chat-feed {
            width: min(720px, 100% - 32px);
            padding: 32px 0 100px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Message Bubbles - OpenAI Style */
        .message-row {
            display: flex;
            gap: 16px;
            width: 100%;
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--soft);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--indigo);
            font-size: 14px;
            font-weight: 700;
        }

        .message-row.user .avatar {
            background: var(--indigo);
            color: #ffffff;
        }

        .bubble {
            flex: 1;
            max-width: calc(100% - 48px);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
        }

        .message-row.user .bubble {
            background: var(--soft);
            color: var(--ink);
            border-top-right-radius: 0;
        }

        .message-row.model .bubble {
            background: transparent;
            color: var(--ink);
            padding-left: 0;
            padding-right: 0;
        }

        .bubble p { margin: 0 0 12px 0; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble ul, .bubble ol { margin: 0 0 12px 0; padding-left: 20px; }
        .bubble li { margin-bottom: 4px; }

        .system-error-bubble {
            align-self: center;
            background: #fff1ee;
            color: #7a271a;
            border: 1px solid #ffd6d0;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            text-align: center;
        }
        .dark-mode .system-error-bubble {
            background: #2f1719;
            color: #ffa299;
            border-color: #632629;
        }

        /* Typing indicator */
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            padding: 4px 8px;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--muted);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        .typing-dot:nth-child(3) { animation-delay: -0.08s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Welcome Page / Suggestion Cards Grid */
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 400px;
            padding: 40px 0;
        }

        .welcome-logo {
            height: 44px;
            margin-bottom: 16px;
        }

        .welcome-title {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            color: var(--muted);
            font-size: 16px;
            margin-bottom: 36px;
            max-width: 480px;
            line-height: 1.4;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 680px;
        }

        .suggestion-card {
            background: var(--surface-card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px;
            text-align: left;
            cursor: pointer;
            transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
        }
        .suggestion-card:hover {
            transform: translateY(-2px);
            border-color: var(--indigo);
            background: var(--soft);
        }

        .suggestion-card-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--ink);
        }

        .suggestion-card-desc {
            font-size: 12.5px;
            color: var(--muted);
            line-height: 1.4;
        }

        /* Bottom Floating Input Box */
        .chat-input-container {
            position: absolute;
            bottom: 0;
            left: 280px; /* Width of sidebar */
            right: 0;
            padding: 24px;
            background: linear-gradient(180deg, transparent, var(--surface) 40%);
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            z-index: 5;
            transition: left 0.25s ease-in-out;
        }

        .chat-input-wrapper {
            width: min(720px, 100%);
            position: relative;
            background: var(--surface-card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 14px;
            box-shadow: rgba(0,0,0,0.04) 0 4px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-input-wrapper textarea {
            flex: 1;
            border: none;
            background: transparent;
            resize: none;
            height: 24px;
            max-height: 200px;
            color: var(--ink);
            line-height: 1.5;
            padding: 2px 0;
            outline: none;
        }

        .chat-input-wrapper textarea::placeholder {
            color: var(--muted);
        }

        .send-btn {
            background: var(--indigo);
            border: none;
            color: #ffffff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 150ms ease, opacity 150ms ease;
        }
        .send-btn:hover {
            background: var(--purple);
        }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-disclaimer {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
            text-align: center;
        }

        /* Mobile View Styles */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .chat-input-container {
                left: 0 !important;
            }
            .menu-toggle {
                display: flex;
            }
            .suggestions-grid {
                grid-template-columns: 1fr;
            }
            .welcome-title {
                font-size: 26px;
            }
            .welcome-subtitle {
                font-size: 14px;
                margin-bottom: 24px;
            }
        }
    </style>
</head>
<body>
    <div id="root" style="width: 100%; height: 100%;"></div>

    <script type="module" src="/assets/chat.js"></script>
</body>
</html>
