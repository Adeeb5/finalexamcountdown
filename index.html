<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finals+ | UiTM Final Exam Countdown</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script type="module">
        import { animate, stagger } from 'https://cdn.jsdelivr.net/npm/motion@12.41.0/+esm';
        window.Motion = { animate, stagger };
        window.dispatchEvent(new Event('motion-ready'));
    </script>
    <style>
        :root {
            --indigo: #3f51b5;
            --purple: #5640a6;
            --royal: #36266c;
            --navy: #20356b;
            --gold: #ffc94e;
            --ink: #1f2433;
            --muted: #5f5870;
            --soft: #f4f2fa;
            --surface: #ffffff;
            --surface-card: #ffffff;
            --ink-lead: #342d48;
            --line: rgba(31, 36, 51, 0.12);
            --glass: rgba(244, 242, 250, 0.86);
            --danger: #b42318;
            --success: #067647;
            --warning-bg: #fff8df;
            --warning-line: #ffd77a;
            --font-display: "SF Pro Display", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --font-text: "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body.dark-mode {
            --surface: #0b0e14;
            --surface-card: #151922;
            --ink: #f4f2fa;
            --soft: #1d222e;
            --muted: #958ea3;
            --line: rgba(255, 255, 255, 0.08);
            --glass: rgba(11, 14, 20, 0.85);
            --warning-bg: #2d2613;
            --warning-line: #b28e20;
            --indigo: #788bfc;
            --purple: #9a8bfc;
            --ink-lead: #d0c9e3;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--surface);
            font-family: var(--font-text);
            letter-spacing: 0;
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision;
        }
        button, input, a { font: inherit; }
        button:disabled { cursor: wait; opacity: 0.72; }
        a { color: inherit; }
        code { font-family: "SF Mono", Consolas, monospace; }

        .global-nav {
            position: sticky;
            top: 0;
            z-index: 20;
            height: 44px;
            color: #fff;
            background: var(--royal);
        }
        .wrap, .nav-inner, .subnav-inner {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
        }
        .nav-inner, .subnav-inner {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
        }
        .brand svg { width: 18px; height: 18px; }
        .nav-links a, .text-link { display: inline-flex; align-items: center; gap: 6px; }
        .icon { width: 1em; height: 1em; flex: 0 0 auto; stroke-width: 2.2; }
        .icon.sm { width: 16px; height: 16px; }
        .icon.md { width: 18px; height: 18px; }
        .icon.lg { width: 22px; height: 22px; }
        .nav-links { display: flex; gap: 24px; font-size: 12px; opacity: 0.9; }
        .nav-links a { text-decoration: none; }

        .sub-nav {
            position: sticky;
            top: 44px;
            z-index: 19;
            height: 54px;
            background: var(--glass);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
        }
        .sub-title {
            font-family: var(--font-display);
            font-size: 21px;
            font-weight: 700;
        }
        .sub-actions { display: flex; align-items: center; gap: 12px; font-size: 14px; }

        .pill, .icon-btn {
            border: 1px solid transparent;
            border-radius: 999px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
        }
        .pill {
            min-height: 42px;
            padding: 10px 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }
        .pill:active, .icon-btn:active { transform: scale(0.97); }
        .pill:focus-visible, .icon-btn:focus-visible, input:focus-visible { outline: 2px solid var(--purple); outline-offset: 3px; }
        .primary { color: #fff; background: var(--indigo); }
        .primary:hover { background: var(--purple); }
        .secondary { color: var(--indigo); background: transparent; border-color: var(--indigo); }
        .secondary:hover { background: var(--soft); }
        .danger { color: var(--danger); background: #fff7f6; border-color: #ffd6d0; }
        .danger:hover { background: #ffe6e3; border-color: #ffb4a9; }
        .dark-mode .danger { color: #ff9b90; background: #2a1215; border-color: #5c1e24; }
        .dark-mode .danger:hover { background: #3d1b20; border-color: #8c2a32; }
        .text-link { color: var(--indigo); text-decoration: none; }
        .text-link:hover { text-decoration: underline; }

        .hero {
            min-height: calc(100svh - 98px);
            padding: 56px 0 36px;
            background:
                linear-gradient(120deg, rgba(255,201,78,0.15), transparent 34%),
                linear-gradient(180deg, var(--surface) 0%, var(--soft) 100%);
        }
        .hero-grid {
            display: grid;
            grid-template-columns: minmax(0, 0.92fr) minmax(360px, 1.08fr);
            gap: 42px;
            align-items: center;
        }
        .eyebrow { margin: 0 0 14px; color: var(--muted); font-size: 14px; font-weight: 700; }
        h1, h2, h3, p { margin-top: 0; }
        h1 {
            margin-bottom: 18px;
            font-family: var(--font-display);
            font-size: clamp(48px, 7vw, 84px);
            line-height: 1.02;
            font-weight: 700;
        }
        .lead {
            max-width: 620px;
            margin-bottom: 28px;
            color: var(--ink-lead);
            font-size: clamp(22px, 2.8vw, 30px);
            line-height: 1.22;
        }
        .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
        .device-stage { min-height: 520px; display: grid; place-items: center; }
        .device {
            width: min(420px, 88vw);
            border-radius: 32px;
            padding: 18px;
            background: linear-gradient(180deg, var(--surface-card), var(--soft));
            box-shadow: rgba(0,0,0,0.15) 0 24px 70px;
            border: 1px solid var(--line);
        }
        .screen {
            min-height: 460px;
            border-radius: 24px;
            padding: 24px;
            background: var(--surface-card);
            overflow: hidden;
        }
        .screen-top { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-weight: 700; margin-bottom: 30px; }
        .big-count { font-family: var(--font-display); font-size: 74px; line-height: 0.92; font-weight: 700; }
        .device-label { margin: 10px 0 34px; color: var(--muted); font-size: 17px; line-height: 1.35; }
        .mini-stack { display: grid; gap: 10px; }
        .mini-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; background: var(--soft); }
        .mini-dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--indigo), var(--purple)); font-size: 13px; font-weight: 700; }
        .mini-title { margin: 0 0 2px; font-size: 15px; font-weight: 700; }
        .mini-meta, .mini-state { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.3; }
        .mini-state { color: var(--indigo); font-weight: 700; }

        .section { padding: 72px 0; }
        .section.light { background: var(--surface); }
        .section.soft { background: var(--soft); }
        .section.dark { color: #fff; background: linear-gradient(120deg, var(--royal), var(--navy)); }
        .center { text-align: center; }
        h2 { margin-bottom: 12px; font-family: var(--font-display); font-size: clamp(34px, 5vw, 54px); line-height: 1.08; font-weight: 700; }
        .section-note { max-width: 760px; margin: 0 auto 32px; color: var(--muted); font-size: 21px; line-height: 1.35; }
        .dark .section-note { color: #e8e3fb; }

        .tool-panel {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 18px;
            margin-top: 34px;
            text-align: left;
        }
        .panel-card {
            display: flex;
            flex-direction: column;
            padding: 24px;
            border-radius: 8px;
            background: var(--surface-card);
            border: 1px solid var(--line);
            box-shadow: rgba(0,0,0,0.06) 0 10px 30px;
        }
        .panel-card h3 { margin-bottom: 8px; font-size: 24px; line-height: 1.18; }
        .panel-card p { margin-bottom: 18px; color: var(--muted); line-height: 1.45; min-height: 48px; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        .input-row input {
            width: 100%;
            min-height: 46px;
            border-radius: 8px;
            border: 1px solid var(--line);
            padding: 0 14px;
            color: var(--ink);
            background: var(--soft);
        }
        .help { margin-top: 12px; color: var(--muted); font-size: 13px; line-height: 1.4; min-height: 38px; }
        .message {
            width: min(1120px, calc(100% - 32px));
            margin: 18px auto 0;
            padding: 14px 16px;
            border-radius: 8px;
            color: #332d45;
            background: var(--warning-bg);
            border: 1px solid var(--warning-line);
            text-align: left;
        }
        .message.error { color: #7a271a; background: #fff1ee; border-color: #ffd6d0; }
        .message.success { color: #075e45; background: #ecfdf3; border-color: #abefc6; }
        .dark-mode .message { color: var(--ink); }
        .dark-mode .message.error { color: #ffa299; background: #2f1719; border-color: #632629; }
        .dark-mode .message.success { color: #8ef7c7; background: #0c2b1e; border-color: #1a5c40; }

        .exam-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
        .exam-card { min-height: 306px; padding: 24px; border-radius: 8px; background: var(--surface-card); border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; text-align: left; }
        .exam-code { margin: 0 0 8px; font-family: var(--font-display); font-size: 34px; font-weight: 700; }
        .exam-meta { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.42; }
        .subject-name { margin: 0 0 12px; color: var(--ink); font-size: 16px; font-weight: 700; line-height: 1.28; }
        .lecturer-line { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; color: #43385f; font-size: 14px; line-height: 1.35; }
        .dark-mode .lecturer-line { color: #bcaedc; }
        .lecturer-line .icon { margin-top: 1px; color: var(--purple); }
        .missing-detail { color: #7a5a00; }
        .status-pill { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; margin-top: 22px; padding: 8px 14px; border-radius: 999px; color: var(--indigo); background: var(--soft); border: 2px solid var(--line); font-size: 14px; font-weight: 700; }
        .status-pill.running { color: var(--danger); background: #fff1ee; border-color: #ffd6d0; }
        .status-pill.finished { color: var(--muted); background: var(--soft); border-color: var(--line); }
        .card-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
        .icon-btn { min-width: 38px; height: 38px; display: inline-grid; place-items: center; color: var(--danger); background: var(--soft); border-color: var(--line); line-height: 1; }
        .icon-btn:hover { background: #ffe6e3; border-color: #ffb4a9; }
        .dark-mode .icon-btn { background: #351c20; border-color: #5b282c; }
        .dark-mode .icon-btn:hover { background: #4d2328; border-color: #8c2a32; }
 
        .schedule-list { display: grid; gap: 12px; max-width: 940px; margin: 0 auto; }
        .schedule-row { display: grid; grid-template-columns: 100px 1fr auto 40px; gap: 18px; align-items: center; padding: 18px 22px; border-radius: 8px; background: var(--surface-card); border: 1px solid var(--line); text-align: left; }
        .schedule-code { font-size: 21px; font-weight: 700; }
        .schedule-detail { color: var(--muted); font-size: 15px; line-height: 1.4; }
        .schedule-time { white-space: nowrap; color: var(--ink); font-size: 15px; }
        .empty { max-width: 640px; margin: 0 auto; padding: 42px 24px; border-radius: 8px; background: var(--surface-card); border: 1px solid var(--line); color: var(--muted); }

        footer { padding: 64px 0; background: var(--soft); color: var(--muted); font-size: 12px; line-height: 1.45; }
        .footer-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 32px;
            align-items: flex-start;
        }
        .footer-brand {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .footer-logo {
            height: 32px;
            align-self: flex-start;
        }
        .footer-links {
            display: flex;
            gap: 24px;
            font-weight: 500;
        }
        .footer-links a {
            text-decoration: none;
            color: var(--muted);
            transition: color 150ms ease;
        }
        .footer-links a:hover {
            color: var(--indigo);
            text-decoration: underline;
        }
        .footer-credits {
            font-size: 13px;
            color: var(--ink);
            font-weight: 600;
        }
        .footer-disclaimer {
            grid-column: 1 / -1;
            border-top: 1px solid var(--line);
            padding-top: 20px;
            margin-top: 8px;
            font-size: 11px;
            line-height: 1.6;
        }

        @media (max-width: 900px) {
            .hero-grid, .tool-panel { grid-template-columns: 1fr; }
            .hero-grid { text-align: center; }
            .lead { margin-left: auto; margin-right: auto; }
            .hero-actions { justify-content: center; }
            .device-stage { min-height: 410px; }
            .screen { min-height: 410px; }
            .schedule-row { grid-template-columns: 1fr; gap: 6px; }
            .schedule-time { white-space: normal; }
            .panel-card p { min-height: auto; }
            .help { min-height: auto; }
        }
        @media (max-width: 560px) {
            .wrap, .nav-inner, .subnav-inner { width: min(100% - 24px, 1120px); }
            .nav-links a:nth-child(n+3), .sub-actions .text-link { display: none; }
            .nav-links { gap: 16px; }
            .hero { padding-top: 44px; }
            h1 { font-size: 44px; }
            .lead { font-size: 22px; }
            .section { padding: 62px 0; }
            .input-row { flex-direction: column; align-items: stretch; }
            .pill { width: 100%; }
            .mini-row { grid-template-columns: 44px 1fr; }
            .mini-state { grid-column: 2; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react">
        const { useEffect, useState } = React;
        const STORAGE_KEY = 'uitm-final-exams-v1';
        const SIMS_URL = '/api/exams';
        const MATRIC_URL = '/api/matric';
        const MONTHS = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5, JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };
        const COURSE_NAME_TRANSLATIONS = {
            'PENGENALAN KEPADA KOMUNIKASI DATA DAN PERANGKAIAN': 'Introduction to Data Communication and Networking',
            'INTRODUCTION TO DATA COMMUNICATIONS AND NETWORKING': 'Introduction to Data Communication and Networking',
            'PENGENALAN KEPADA KEBARANGKALIAN DAN STATISTIK': 'Introduction to Probability and Statistics',
            'ELEKTRONIK DIGITAL': 'Digital Electronics',
        };

        function normalizeCode(value) {
            return String(value || '').trim().toUpperCase().replace(/\s+/g, '');
        }

        function parseCodes(value) {
            return [...new Set(String(value || '').split(/[\s,;]+/).map(normalizeCode).filter(code => /^[A-Z]{2,4}\d{3}[A-Z]?$/.test(code)))];
        }

        function normalizeSubjectName(value) {
            const name = String(value || '').trim().replace(/\s+/g, ' ');
            if (!name) return '';
            return (COURSE_NAME_TRANSLATIONS[name.toUpperCase()] || name).toUpperCase();
        }

        function parseExamDate(dateText, timeText) {
            const dateMatch = String(dateText || '').trim().toUpperCase().match(/(\d{1,2})-([A-Z]{3})-(\d{2,4})/);
            if (!dateMatch) return null;
            const day = Number(dateMatch[1]);
            const month = MONTHS[dateMatch[2]];
            const rawYear = Number(dateMatch[3]);
            const year = rawYear < 100 ? 2000 + rawYear : rawYear;
            const startText = String(timeText || '').split('-')[0]?.trim() || '12:00 AM';
            const timeMatch = startText.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)/i);
            let hour = timeMatch ? Number(timeMatch[1]) : 0;
            const minute = timeMatch ? Number(timeMatch[2]) : 0;
            const meridiem = timeMatch ? timeMatch[3].toUpperCase() : 'AM';
            if (meridiem === 'PM' && hour !== 12) hour += 12;
            if (meridiem === 'AM' && hour === 12) hour = 0;
            return new Date(year, month, day, hour, minute, 0).toISOString();
        }

        function calculateTimeLeft(dateStr) {
            const difference = +new Date(dateStr) - +new Date();
            if (difference <= 0) return null;
            return {
                days: Math.floor(difference / 86400000),
                hours: Math.floor((difference / 3600000) % 24),
                minutes: Math.floor((difference / 60000) % 60),
                seconds: Math.floor((difference / 1000) % 60),
            };
        }

        function getStatus(exam) {
            const now = new Date();
            const start = new Date(exam.dateStr);
            const end = exam.endTimeStr ? new Date(exam.endTimeStr) : new Date(start.getTime() + 3 * 3600000);
            if (now > end) return 'finished';
            if (now >= start && now <= end) return 'running';
            return 'upcoming';
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
        }

        function formatTime(dateStr) {
            return new Date(dateStr).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }

        function statusCopy(exam) {
            const status = getStatus(exam);
            const timeLeft = calculateTimeLeft(exam.dateStr);
            if (status === 'finished') return 'Completed';
            if (status === 'running') return 'In progress';
            if (!timeLeft) return 'Scheduled';
            return `${timeLeft.days}d ${timeLeft.hours}h ${timeLeft.minutes}m`;
        }

        function parseSimsHtml(html, requestedCodes) {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const rows = [...doc.querySelectorAll('table tbody tr')];
            const found = rows.map(row => {
                const cells = [...row.querySelectorAll('td')].map(cell => cell.textContent.trim().replace(/\s+/g, ' '));
                if (cells.length < 3) return null;
                const code = normalizeCode(cells[0]);
                const dateStr = parseExamDate(cells[1], cells[2]);
                if (!code || !dateStr) return null;
                return {
                    code,
                    dateStr,
                    endTimeStr: null,
                    rawDate: cells[1],
                    rawTime: cells[2],
                    location: 'Check official venue slip',
                    source: 'SIMS exam schedule',
                    updatedAt: new Date().toISOString(),
                };
            }).filter(Boolean);
            const foundCodes = new Set(found.map(exam => exam.code));
            return { found, missing: requestedCodes.filter(code => !foundCodes.has(code)) };
        }

        async function fetchExamSchedule(codes) {
            const res = await fetch(SIMS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
                body: new URLSearchParams({ codes: codes.join(',') }),
            });
            const payload = await res.json();
            if (!res.ok) throw new Error(payload.error || `SIMS returned ${res.status}`);
            return payload;
        }

        async function fetchMatricCourses(studentId) {
            const res = await fetch(MATRIC_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
                body: new URLSearchParams({ studentId: studentId.trim() }),
            });
            const payload = await res.json();
            if (!res.ok) throw new Error(payload.error || `Timetable service returned ${res.status}`);
            return {
                codes: payload.codes || [],
                subjects: payload.subjects || [],
            };
        }
        function loadStored() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]').map(exam => ({
                    ...exam,
                    subjectName: normalizeSubjectName(exam.subjectName),
                }));
            }
            catch { return []; }
        }

        function saveStored(exams) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(exams));
        }

        function getMotion() {
            const candidates = [window.Motion, window.motion, window.MotionOne, window.motionOne].filter(Boolean);
            return candidates.find(candidate => candidate.animate) || null;
        }

        function useClock() {
            const [, setTick] = useState(Date.now());
            useEffect(() => {
                const timer = setInterval(() => setTick(Date.now()), 1000);
                return () => clearInterval(timer);
            }, []);
        }

        function toLucideName(name) {
            return String(name).replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
        }

        const Icon = ({ name, size = 18, className = "icon" }) => (
            <i data-lucide={toLucideName(name)} className={className} style={{ width: size, height: size }} aria-hidden="true"></i>
        );

        const PRIVACY_CONTENT = (
            <>
                <p><strong>1. Privacy First</strong></p>
                <p>We value your privacy. This application does not collect, track, or share any of your personal identification information.</p>
                <p><strong>2. No Database / Server Storage</strong></p>
                <p>We do not store your student ID, matric number, or exam schedule in any database or external server. All processing is done directly on your browser.</p>
                <p><strong>3. Client-Side Cache (LocalStorage)</strong></p>
                <p>All your selected course codes and scheduled final exam data are cached locally inside your web browser using LocalStorage. You can clear this data at any time by clicking "Clear all saved subjects" in the Schedule section.</p>
                <p><strong>4. Timetable Fetching</strong></p>
                <p>When importing via matric number, your student ID is only sent temporarily to the timetable service to retrieve your registered course list, and is never logged or saved.</p>
            </>
        );

        const TERMS_CONTENT = (
            <>
                <p><strong>1. Use of the Service</strong></p>
                <p>Finals+ is a personal tracking tool designed to help UiTM students monitor their upcoming exam countdowns. It is provided for personal use only.</p>
                <p><strong>2. No Affiliation</strong></p>
                <p>This web application is completely independent and has no official affiliation with Universiti Teknologi MARA (UiTM).</p>
                <p><strong>3. Accuracy of Schedule Data</strong></p>
                <p>While we pull exam dates directly from official sources, students must always verify their final schedules and venues with their official UiTM Student Portal or exam slip.</p>
                <p><strong>4. Disclaimer</strong></p>
                <p>The application is provided "as is" without warranty of any kind. The developer (Adeeb) is not responsible for any scheduling conflicts, missed exams, or errors in the countdown data.</p>
            </>
        );

        const Modal = ({ isOpen, onClose, title, content }) => {
            if (!isOpen) return null;
            return (
                <div style={{
                    position: 'fixed',
                    top: 0,
                    left: 0,
                    right: 0,
                    bottom: 0,
                    backgroundColor: 'rgba(31, 36, 51, 0.4)',
                    backdropFilter: 'blur(8px)',
                    display: 'grid',
                    placeItems: 'center',
                    zIndex: 9999,
                    padding: '20px'
                }} onClick={onClose}>
                    <div style={{
                        backgroundColor: '#ffffff',
                        borderRadius: '16px',
                        padding: '32px',
                        maxWidth: '560px',
                        width: '100%',
                        maxHeight: '80vh',
                        overflowY: 'auto',
                        boxShadow: 'rgba(54, 38, 108, 0.16) 0 20px 60px',
                        border: '1px solid var(--line)',
                        position: 'relative'
                    }} onClick={e => e.stopPropagation()}>
                        <button style={{
                            position: 'absolute',
                            top: '20px',
                            right: '20px',
                            background: 'none',
                            border: 'none',
                            cursor: 'pointer',
                            color: 'var(--muted)',
                            padding: '4px'
                        }} onClick={onClose}>
                            <Icon name="X" size={20} />
                        </button>
                        <h3 style={{ fontFamily: 'var(--font-display)', fontSize: '24px', fontWeight: 700, marginBottom: '16px', color: 'var(--ink)' }}>{title}</h3>
                        <div style={{ color: 'var(--muted)', fontSize: '14px', lineHeight: 1.6, display: 'grid', gap: '12px' }}>
                            {content}
                        </div>
                        <div style={{ marginTop: '24px', display: 'flex', justifyContent: 'flex-end' }}>
                            <button className="pill primary" onClick={onClose}>Close</button>
                        </div>
                    </div>
                </div>
            );
        };

        const Logo = () => <img src="/assets/logo-icon-white.png" alt="F+" style={{ height: '22px', verticalAlign: 'middle' }} />;
        const Nav = ({ darkMode, onToggleTheme }) => (
            <>
                <nav className="global-nav" aria-label="Global"><div className="nav-inner"><span className="brand" style={{ display: 'inline-flex', alignItems: 'center', gap: '8px' }}><Logo /> Finals+</span><div className="nav-links" style={{ display: 'flex', alignItems: 'center', gap: '24px' }}><a href="#add"><Icon name="Plus" size={14} /> Add</a><a href="#exams"><Icon name="BookOpen" size={14} /> Exams</a><a href="#schedule"><Icon name="CalendarDays" size={14} /> Schedule</a><button onClick={onToggleTheme} style={{ background: 'none', border: 'none', color: 'inherit', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', padding: '4px' }} aria-label="Toggle dark mode" title="Toggle dark mode"><Icon name={darkMode ? "Sun" : "Moon"} size={15} /></button></div></div></nav>
                <div className="sub-nav"><div className="subnav-inner"><div className="sub-title"><img src="/assets/logo.png" alt="Finals+" style={{ height: '28px', display: 'block' }} /></div><div className="sub-actions"><a className="text-link" href="#add"><Icon name="Download" size={16} /> Import</a><a className="pill primary" href="#exams"><Icon name="ListChecks" size={18} /> My exams</a></div></div></div>
            </>
        );

        const Hero = ({ exams }) => {
            const upcoming = exams.filter(exam => getStatus(exam) === 'upcoming').sort((a, b) => new Date(a.dateStr) - new Date(b.dateStr));
            const nextExam = upcoming[0];
            const main = nextExam ? calculateTimeLeft(nextExam.dateStr)?.days ?? 0 : exams.length;
            const label = nextExam ? `days to ${nextExam.code}` : exams.length ? 'saved exam subjects' : 'saved subjects';
            const preview = (exams.length ? exams : [
                { code: 'CSC207', dateStr: new Date(Date.now() + 86400000 * 12).toISOString(), rawTime: 'Add your real course' },
                { code: 'MAT210', dateStr: new Date(Date.now() + 86400000 * 16).toISOString(), rawTime: 'Saved locally' },
                { code: 'ICT200', dateStr: new Date(Date.now() + 86400000 * 19).toISOString(), rawTime: 'Restored on reopen' },
            ]).slice(0, 3);
            return (
                <section className="hero motion-root" id="overview"><div className="wrap hero-grid"><div><p className="eyebrow">Personal UiTM final exam tracker</p><h1>Your finals, saved for next time.</h1><p className="lead">Add course codes or import from matric number, then the app saves your selected exam subjects in this browser.</p><div className="hero-actions"><a className="pill primary" href="#add"><Icon name="Plus" size={18} /> Add subjects</a><a className="pill secondary" href="#schedule"><Icon name="CalendarDays" size={18} /> View schedule</a></div></div><div className="device-stage" aria-hidden="true"><div className="device"><div className="screen"><div className="screen-top"><span style={{ display: 'flex', alignItems: 'center', gap: '4px' }}><img src="/assets/logo-icon.png" alt="F+" style={{ height: '14px' }} /> Finals+</span><span>{new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</span></div><div className="big-count">{String(main).padStart(2, '0')}</div><p className="device-label">{label}</p><div className="mini-stack">{preview.map(exam => <div className="mini-row" key={exam.code}><div className="mini-dot">{exam.code.slice(0, 3)}</div><div><p className="mini-title">{exam.code}</p><p className="mini-meta">{formatDate(exam.dateStr)}</p></div><p className="mini-state">{exam.rawTime || statusCopy(exam)}</p></div>)}</div></div></div></div></div></section>
            );
        };

        const AddPanel = ({ onAdd, onImport, busy }) => {
            const [codes, setCodes] = useState('');
            const [studentId, setStudentId] = useState('');
            return (
                <section className="section light" id="add"><div className="wrap center"><h2>Build your own list.</h2><p className="section-note">Search the official SIMS exam schedule by course code, or pull timetable subjects by matric number and match the courses that have finals.</p><div className="tool-panel"><div className="panel-card motion-item"><h3>Add by course code</h3><p>Enter one or many codes separated by commas.</p><div className="input-row"><input value={codes} onChange={e => setCodes(e.target.value.toUpperCase())} placeholder="CSC207, ICT200, MAT210" aria-label="Course codes" /><button className="pill primary" disabled={busy} onClick={() => onAdd(codes)}><Icon name="Search" size={18} /> Fetch</button></div><div className="help">Fetched subjects are cached locally in this browser and restored when the site opens again.</div></div><div className="panel-card motion-item"><h3>Import by matric no.</h3><p>Uses the UiTM Timetable matric flow to get subjects, then checks those codes against SIMS final exam records.</p><div className="input-row"><input value={studentId} onChange={e => setStudentId(e.target.value)} placeholder="Student ID / matric no." aria-label="Student ID or matric number" /><button className="pill primary" disabled={busy} onClick={() => onImport(studentId)}><Icon name="Download" size={18} /> Import</button></div><div className="help">The matric number is only sent when Import is pressed. This app does not save it.</div></div></div></div></section>
            );
        };

        const ExamCard = ({ exam, onRemove }) => {
            const status = getStatus(exam);
            return <article className="exam-card motion-item"><div><h3 className="exam-code">{exam.code}</h3><p className="subject-name">{exam.subjectName || 'Subject name available after matric import'}</p><p className="exam-meta">{formatDate(exam.dateStr)}<br />{exam.rawTime || formatTime(exam.dateStr)}<br />{exam.location}</p><p className={`lecturer-line ${exam.lecturer ? '' : 'missing-detail'}`}><Icon name="UserRound" size={16} /> <span>{exam.lecturer || 'Lecturer name available after matric import'}</span></p></div><div><span className={`status-pill ${status}`}><Icon name={status === "finished" ? "CheckCircle2" : status === "running" ? "AlarmClock" : "Clock3"} size={16} /> {statusCopy(exam)}</span><div className="card-actions"><p className="exam-meta">{exam.source}</p><button className="icon-btn" onClick={() => onRemove(exam.code)} aria-label={`Remove ${exam.code}`} title={`Remove ${exam.code}`}><Icon name="Trash2" size={18} /></button></div></div></article>;
        };

        const Exams = ({ exams, onRemove }) => (
            <section className="section soft" id="exams"><div className="wrap center"><h2>{exams.length ? 'Your final exam subjects.' : 'No subjects saved yet.'}</h2><p className="section-note">Only courses with final exam records are shown here. Remove anything you are not taking.</p>{exams.length ? <div className="exam-grid">{exams.map(exam => <ExamCard key={exam.code} exam={exam} onRemove={onRemove} />)}</div> : <div className="empty">Add a course code or import by matric number to create your personal final exam list.</div>}</div></section>
        );

        const Details = () => <section className="section dark"><div className="wrap center"><h2>Stay ahead of your finals.</h2><p className="section-note">Track the remaining days, hours, and minutes for each exam. Plan your revision periods and walk into the exam hall with confidence.</p></div></section>;

        const Schedule = ({ exams, onClear }) => {
            const sorted = [...exams].sort((a, b) => new Date(a.dateStr) - new Date(b.dateStr));
            return <section className="section light" id="schedule"><div className="wrap center"><h2>Saved schedule.</h2><p className="section-note">This timetable is restored from local storage whenever you open this browser again.</p>{sorted.length ? <div className="schedule-list">{sorted.map(exam => <div className="schedule-row" key={exam.code}><div className="schedule-code">{exam.code}</div><div className="schedule-detail">{formatDate(exam.dateStr)} - {exam.location}</div><div className="schedule-time">{exam.rawTime || formatTime(exam.dateStr)}</div><button className="icon-btn" onClick={() => onClear(exam.code)} aria-label={`Remove ${exam.code}`} title={`Remove ${exam.code}`}><Icon name="Trash2" size={18} /></button></div>)}</div> : <div className="empty">Your saved timetable will appear here.</div>}{sorted.length ? <div style={{ marginTop: 22 }}><button className="pill danger" onClick={() => onClear()}><Icon name="Trash2" size={18} /> Clear all saved subjects</button></div> : null}</div></section>;
        };

        const App = () => {
            useClock();
            const [exams, setExams] = useState(loadStored);
            const [busy, setBusy] = useState(false);
            const [message, setMessage] = useState(null);
            const [modal, setModal] = useState({ isOpen: false, title: '', content: null });
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');

            useEffect(() => {
                if (darkMode) {
                    document.body.classList.add('dark-mode');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.body.classList.remove('dark-mode');
                    localStorage.setItem('theme', 'light');
                }
            }, [darkMode]);

            useEffect(() => saveStored(exams), [exams]);
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });
            useEffect(() => {
                const runIntro = () => {
                    const motion = getMotion();
                    if (!motion) return false;
                    const { animate, stagger } = motion;
                    animate('.motion-root h1, .motion-root .lead, .motion-root .hero-actions, .device', { opacity: [0, 1], y: [18, 0] }, { duration: 0.7, delay: stagger(0.08), easing: 'ease-out' });
                    animate('.panel-card', { opacity: [0, 1], y: [14, 0] }, { duration: 0.45, delay: stagger(0.04), easing: 'ease-out' });
                    return true;
                };
                if (runIntro()) return;
                window.addEventListener('motion-ready', runIntro, { once: true });
                return () => window.removeEventListener('motion-ready', runIntro);
            }, []);
            useEffect(() => {
                const runCards = () => {
                    const motion = getMotion();
                    if (!motion) return false;
                    const { animate } = motion;
                    document.querySelectorAll('.exam-card, .panel-card').forEach(card => {
                        if (!card.dataset.motionReady) {
                            card.dataset.motionReady = 'true';
                            card.addEventListener('pointerenter', () => animate(card, { y: -4, scale: 1.01 }, { duration: 0.18 }));
                            card.addEventListener('pointerleave', () => animate(card, { y: 0, scale: 1 }, { duration: 0.18 }));
                        }
                    });
                    if (document.querySelector('.exam-card')) {
                        animate('.exam-card', { opacity: [0, 1], y: [14, 0] }, { duration: 0.35, easing: 'ease-out' });
                    }
                    return true;
                };
                if (runCards()) return;
                window.addEventListener('motion-ready', runCards, { once: true });
                return () => window.removeEventListener('motion-ready', runCards);
            }, [exams.length]);

            const mergeExams = incoming => {
                setExams(prev => {
                    const map = new Map(prev.map(exam => [exam.code, exam]));
                    incoming.forEach(exam => map.set(exam.code, exam));
                    return [...map.values()].sort((a, b) => new Date(a.dateStr) - new Date(b.dateStr));
                });
            };

            const addCodes = async value => {
                const codes = parseCodes(value);
                if (!codes.length) { setMessage({ type: 'error', text: 'Enter at least one valid course code, for example CSC207.' }); return; }
                setBusy(true);
                setMessage({ type: 'info', text: `Fetching ${codes.join(', ')} from SIMS exam schedule...` });
                try {
                    const { found, missing } = await fetchExamSchedule(codes);
                    if (found.length) mergeExams(found);
                    const parts = [];
                    if (found.length) parts.push(`Saved ${found.map(exam => exam.code).join(', ')}.`);
                    if (missing.length) parts.push(`No final exam record found for ${missing.join(', ')}.`);
                    setMessage({ type: found.length ? 'success' : 'error', text: parts.join(' ') });
                } catch (error) {
                    setMessage({ type: 'error', text: `Could not fetch directly from SIMS. The official endpoint may block browser CORS, which means deployment needs a small backend proxy. Details: ${error.message}` });
                } finally {
                    setBusy(false);
                }
            };

            const importMatric = async studentId => {
                if (!studentId.trim()) { setMessage({ type: 'error', text: 'Enter a matric number first.' }); return; }
                setBusy(true);
                setMessage({ type: 'info', text: 'Fetching timetable subjects, then checking finals in SIMS...' });
                try {
                    const { codes, subjects } = await fetchMatricCourses(studentId);
                    if (!codes.length) throw new Error('No course codes returned from timetable.');
                    const detailsByCode = new Map(subjects.map(subject => [subject.code, subject]));
                    const { found, missing } = await fetchExamSchedule(codes);
                    const enriched = found.map(exam => ({
                        ...exam,
                        subjectName: normalizeSubjectName(exam.subjectName || detailsByCode.get(exam.code)?.subjectName),
                        lecturer: detailsByCode.get(exam.code)?.lecturer || '',
                    }));
                    if (enriched.length) mergeExams(enriched);
                    setMessage({ type: enriched.length ? 'success' : 'error', text: `Timetable returned ${codes.length} course code(s). Saved ${enriched.length} final exam subject(s) with lecturer details when available. ${missing.length ? `No final exam record for: ${missing.join(', ')}.` : ''}` });
                } catch (error) {
                    setMessage({ type: 'error', text: `Matric import could not complete from this static page. It may need a backend proxy if an external API blocks browser requests. Details: ${error.message}` });
                } finally {
                    setBusy(false);
                }
            };

            const removeExam = code => {
                if (!code) {
                    setExams([]);
                    setMessage({ type: 'success', text: 'Cleared all saved subjects from this browser.' });
                    return;
                }
                setExams(prev => prev.filter(exam => exam.code !== code));
                setMessage({ type: 'success', text: `Removed ${code} from your saved list.` });
            };

            return <><Nav darkMode={darkMode} onToggleTheme={() => setDarkMode(!darkMode)} /><Hero exams={exams} /><AddPanel onAdd={addCodes} onImport={importMatric} busy={busy} />{message ? <div className={`message ${message.type === 'error' ? 'error' : message.type === 'success' ? 'success' : ''}`}>{message.text}</div> : null}<Exams exams={exams} onRemove={removeExam} /><Details /><Schedule exams={exams} onClear={removeExam} /><footer><div className="wrap footer-grid"><div className="footer-brand"><img src="/assets/logo.png" alt="Finals+" className="footer-logo" /><div className="footer-credits">Developed by Adeeb</div><div>&copy; {new Date().getFullYear()} Finals+. All rights reserved.</div></div><div className="footer-links"><a href="#privacy" onClick={e => { e.preventDefault(); setModal({ isOpen: true, title: 'Privacy Policy', content: PRIVACY_CONTENT }); }}>Privacy Policy</a><a href="#terms" onClick={e => { e.preventDefault(); setModal({ isOpen: true, title: 'Terms of Service', content: TERMS_CONTENT }); }}>Terms of Service</a></div><div className="footer-disclaimer">Sources: official SIMS exam schedule.</div></div></footer><Modal isOpen={modal.isOpen} onClose={() => setModal({ ...modal, isOpen: false })} title={modal.title} content={modal.content} /></>;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
