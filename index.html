<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://simsweb.uitm.edu.my https://uitmtimetable.com; font-src 'self' data:;">
    <title>Finals+ | UiTM Final Exam Countdown</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" integrity="sha384-toVdrLSMaw7Y55MowcKqkmFL/Ek6Sky62NOk0b5sDDZBu2wcoPyyQUt9unDVjXhL"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" integrity="sha384-uTYyvsSSUZeaPhb5RbKlQa0zY/WpX/QHfvg2mczXyBQOpkWPEDy9lczyp+w7SKXu"></script>
    <style>
        :root {
            --indigo: #3f51b5;
            --purple: #5640a6;
            --royal: #36266c;
            --navy: #20356b;
            --gold: #ffc94e;
            --ink: #1f2433;
            --muted: #5f5870;
            --soft: #f4f2fa;
            --surface: #ffffff;
            --surface-card: #ffffff;
            --ink-lead: #342d48;
            --line: rgba(31, 36, 51, 0.12);
            --glass: rgba(244, 242, 250, 0.86);
            --danger: #b42318;
            --success: #067647;
            --warning-bg: #fff8df;
            --warning-line: #ffd77a;
            --font-display: "SF Pro Display", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --font-text: "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body.dark-mode {
            --surface: #0b0e14;
            --surface-card: #151922;
            --ink: #f4f2fa;
            --soft: #1d222e;
            --muted: #958ea3;
            --line: rgba(255, 255, 255, 0.08);
            --glass: rgba(11, 14, 20, 0.85);
            --warning-bg: #2d2613;
            --warning-line: #b28e20;
            --indigo: #788bfc;
            --purple: #9a8bfc;
            --ink-lead: #d0c9e3;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--surface);
            font-family: var(--font-text);
            letter-spacing: 0;
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision;
        }
        button, input, a { font: inherit; }
        button:disabled { cursor: wait; opacity: 0.72; }
        a { color: inherit; }
        code { font-family: "SF Mono", Consolas, monospace; }

        .global-nav {
            position: sticky;
            top: 0;
            z-index: 20;
            height: 44px;
            color: #fff;
            background: var(--royal);
        }
        .wrap, .nav-inner, .subnav-inner {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
        }
        .nav-inner, .subnav-inner {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
        }
        .brand svg { width: 18px; height: 18px; }
        .nav-links a, .text-link { display: inline-flex; align-items: center; gap: 6px; }
        .icon { width: 1em; height: 1em; flex: 0 0 auto; stroke-width: 2.2; }
        .icon.sm { width: 16px; height: 16px; }
        .icon.md { width: 18px; height: 18px; }
        .icon.lg { width: 22px; height: 22px; }
        .nav-links { display: flex; gap: 24px; font-size: 12px; opacity: 0.9; }
        .nav-links a { text-decoration: none; }

        .sub-nav {
            position: sticky;
            top: 44px;
            z-index: 19;
            height: 54px;
            background: var(--glass);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
        }
        .sub-title {
            font-family: var(--font-display);
            font-size: 21px;
            font-weight: 700;
        }
        .sub-actions { display: flex; align-items: center; gap: 12px; font-size: 14px; }

        .pill, .icon-btn {
            border: 1px solid transparent;
            border-radius: 999px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
        }
        .pill {
            min-height: 42px;
            padding: 10px 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }
        .pill:active, .icon-btn:active { transform: scale(0.97); }
        .pill:focus-visible, .icon-btn:focus-visible, input:focus-visible { outline: 2px solid var(--purple); outline-offset: 3px; }
        .primary { color: #fff; background: var(--indigo); }
        .primary:hover { background: var(--purple); }
        .secondary { color: var(--indigo); background: transparent; border-color: var(--indigo); }
        .secondary:hover { background: var(--soft); }
        .danger { color: var(--danger); background: #fff7f6; border-color: #ffd6d0; }
        .danger:hover { background: #ffe6e3; border-color: #ffb4a9; }
        .dark-mode .danger { color: #ff9b90; background: #2a1215; border-color: #5c1e24; }
        .dark-mode .danger:hover { background: #3d1b20; border-color: #8c2a32; }
        .text-link { color: var(--indigo); text-decoration: none; }
        .text-link:hover { text-decoration: underline; }

        .hero {
            min-height: calc(100svh - 98px);
            padding: 56px 0 36px;
            background:
                linear-gradient(120deg, rgba(255,201,78,0.15), transparent 34%),
                linear-gradient(180deg, var(--surface) 0%, var(--soft) 100%);
        }
        .hero-grid {
            display: grid;
            grid-template-columns: minmax(0, 0.92fr) minmax(360px, 1.08fr);
            gap: 42px;
            align-items: center;
        }
        .eyebrow { margin: 0 0 14px; color: var(--muted); font-size: 14px; font-weight: 700; }
        h1, h2, h3, p { margin-top: 0; }
        h1 {
            margin-bottom: 18px;
            font-family: var(--font-display);
            font-size: clamp(48px, 7vw, 84px);
            line-height: 1.02;
            font-weight: 700;
        }
        .lead {
            max-width: 620px;
            margin-bottom: 28px;
            color: var(--ink-lead);
            font-size: clamp(22px, 2.8vw, 30px);
            line-height: 1.22;
        }
        .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
        .device-stage { min-height: 520px; display: grid; place-items: center; }
        .device {
            width: min(420px, 88vw);
            border-radius: 32px;
            padding: 18px;
            background: linear-gradient(180deg, var(--surface-card), var(--soft));
            box-shadow: rgba(0,0,0,0.15) 0 24px 70px;
            border: 1px solid var(--line);
        }
        .screen {
            min-height: 460px;
            border-radius: 24px;
            padding: 24px;
            background: var(--surface-card);
            overflow: hidden;
        }
        .screen-top { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-weight: 700; margin-bottom: 30px; }
        .big-count { font-family: var(--font-display); font-size: 74px; line-height: 0.92; font-weight: 700; }
        .device-label { margin: 10px 0 34px; color: var(--muted); font-size: 17px; line-height: 1.35; }
        .mini-stack { display: grid; gap: 10px; }
        .mini-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; background: var(--soft); }
        .mini-dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--indigo), var(--purple)); font-size: 13px; font-weight: 700; }
        .mini-title { margin: 0 0 2px; font-size: 15px; font-weight: 700; }
        .mini-meta, .mini-state { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.3; }
        .mini-state { color: var(--indigo); font-weight: 700; }

        .section { padding: 72px 0; scroll-margin-top: 110px; }
        .section.light { background: var(--surface); }
        .section.soft { background: var(--soft); }
        .section.dark { color: #fff; background: linear-gradient(120deg, var(--royal), var(--navy)); }
        .center { text-align: center; }
        h2 { margin-bottom: 12px; font-family: var(--font-display); font-size: clamp(34px, 5vw, 54px); line-height: 1.08; font-weight: 700; }
        .section-note { max-width: 760px; margin: 0 auto 32px; color: var(--muted); font-size: 21px; line-height: 1.35; }
        .dark .section-note { color: #e8e3fb; }

        .tool-panel {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 18px;
            margin-top: 34px;
            text-align: left;
            scroll-margin-top: 110px;
        }
        .panel-card {
            display: flex;
            flex-direction: column;
            padding: 24px;
            border-radius: 8px;
            background: var(--surface-card);
            border: 1px solid var(--line);
            box-shadow: rgba(0,0,0,0.06) 0 10px 30px;
        }
        .panel-card h3 { margin-bottom: 8px; font-size: 24px; line-height: 1.18; }
        .panel-card p { margin-bottom: 18px; color: var(--muted); line-height: 1.45; min-height: 48px; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        .input-row input {
            width: 100%;
            min-height: 46px;
            border-radius: 8px;
            border: 1px solid var(--line);
            padding: 0 14px;
            color: var(--ink);
            background: var(--soft);
        }
        .help { margin-top: 12px; color: var(--muted); font-size: 13px; line-height: 1.4; min-height: 38px; }
        .message {
            width: min(1120px, calc(100% - 32px));
            margin: 18px auto 0;
            padding: 14px 16px;
            border-radius: 8px;
            color: #332d45;
            background: var(--warning-bg);
            border: 1px solid var(--warning-line);
            text-align: left;
        }
        .message.error { color: #7a271a; background: #fff1ee; border-color: #ffd6d0; }
        .message.success { color: #075e45; background: #ecfdf3; border-color: #abefc6; }
        .dark-mode .message { color: var(--ink); }
        .dark-mode .message.error { color: #ffa299; background: #2f1719; border-color: #632629; }
        .dark-mode .message.success { color: #8ef7c7; background: #0c2b1e; border-color: #1a5c40; }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.3; }
        }
        .exam-card.skeleton {
            animation: pulse 1.5s infinite ease-in-out;
            pointer-events: none;
        }
        .skeleton-line {
            background-color: var(--soft);
            border-radius: 4px;
        }

        .exam-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
        .exam-card { min-height: 306px; padding: 24px; border-radius: 8px; background: var(--surface-card); border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; text-align: left; }
        .exam-code { margin: 0 0 8px; font-family: var(--font-display); font-size: 34px; font-weight: 700; }
        .exam-meta { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.42; }
        .subject-name { margin: 0 0 12px; color: var(--ink); font-size: 16px; font-weight: 700; line-height: 1.28; }
        .lecturer-line { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; color: #43385f; font-size: 14px; line-height: 1.35; }
        .dark-mode .lecturer-line { color: #bcaedc; }
        .lecturer-line .icon { margin-top: 1px; color: var(--purple); }
        .missing-detail { color: #7a5a00; }
        .status-pill { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; margin-top: 22px; padding: 8px 14px; border-radius: 999px; color: var(--indigo); background: var(--soft); border: 2px solid var(--line); font-size: 14px; font-weight: 700; }
        .status-pill.running { color: var(--danger); background: #fff1ee; border-color: #ffd6d0; }
        .status-pill.finished { color: var(--muted); background: var(--soft); border-color: var(--line); }
        .card-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
        .icon-btn { min-width: 38px; height: 38px; display: inline-grid; place-items: center; color: var(--danger); background: var(--soft); border-color: var(--line); line-height: 1; }
        .icon-btn:hover { background: #ffe6e3; border-color: #ffb4a9; }
        .dark-mode .icon-btn { background: #351c20; border-color: #5b282c; }
        .dark-mode .icon-btn:hover { background: #4d2328; border-color: #8c2a32; }
 
        .schedule-list { display: grid; gap: 12px; max-width: 940px; margin: 0 auto; }
        .schedule-row { display: grid; grid-template-columns: 100px 1fr auto 40px; gap: 18px; align-items: center; padding: 18px 22px; border-radius: 8px; background: var(--surface-card); border: 1px solid var(--line); text-align: left; }
        .schedule-code { font-size: 21px; font-weight: 700; }
        .schedule-detail { color: var(--muted); font-size: 15px; line-height: 1.4; }
        .schedule-time { white-space: nowrap; color: var(--ink); font-size: 15px; }
        .empty { max-width: 640px; margin: 0 auto; padding: 42px 24px; border-radius: 8px; background: var(--surface-card); border: 1px solid var(--line); color: var(--muted); }

        /* Chat UI Styling */
        #chat.section {
            padding: 44px 0 24px;
        }
        .chat-container {
            max-width: 840px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: 520px;
            border-radius: 8px;
            background: var(--surface-card);
            border: 1px solid var(--line);
            box-shadow: rgba(0,0,0,0.06) 0 10px 30px;
            overflow: hidden;
            text-align: left;
        }
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }
        .chat-message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.5;
            word-break: break-word;
        }
        .chat-message p {
            margin: 0 0 8px 0;
        }
        .chat-message p:last-child {
            margin-bottom: 0;
        }
        .chat-message ul, .chat-message ol {
            margin: 0 0 8px 0;
            padding-left: 20px;
        }
        .chat-message li {
            margin-bottom: 4px;
        }
        .chat-message.user {
            align-self: flex-end;
            background: var(--indigo);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .chat-message.model {
            align-self: flex-start;
            background: var(--soft);
            color: var(--ink);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--line);
        }
        .chat-message.system-error {
            align-self: center;
            background: #fff1ee;
            color: #7a271a;
            border: 1px solid #ffd6d0;
            font-size: 13.5px;
            border-radius: 8px;
        }
        .dark-mode .chat-message.system-error {
            background: #2f1719;
            color: #ffa299;
            border-color: #632629;
        }
        .chat-input-area {
            padding: 16px;
            border-top: 1px solid var(--line);
            background: var(--surface-card);
        }
        .chat-suggestions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            justify-content: flex-start;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .chat-suggestions::-webkit-scrollbar {
            display: none;
        }
        .suggestion-chip {
            flex: 0 0 auto;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            border: 1px solid var(--line);
            background: var(--soft);
            color: var(--ink);
            transition: all 160ms ease;
            font-weight: 500;
        }
        .suggestion-chip:hover {
            background: var(--indigo);
            color: #ffffff;
            border-color: var(--indigo);
        }
        .chat-input-area .input-row {
            flex-direction: row !important;
            align-items: center !important;
            gap: 10px;
        }
        .chat-input-area .input-row input {
            flex: 1 !important;
            width: auto !important;
        }
        .chat-input-area .input-row .pill {
            width: auto !important;
        }
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            padding: 4px 8px;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--muted);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        .typing-dot:nth-child(3) { animation-delay: -0.08s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        footer { padding: 64px 0; background: var(--soft); color: var(--muted); font-size: 12px; line-height: 1.45; }
        .footer-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 32px;
            align-items: flex-start;
        }
        .footer-brand {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .footer-logo {
            height: 32px;
            align-self: flex-start;
        }
        .footer-links {
            display: flex;
            gap: 24px;
            font-weight: 500;
        }
        .footer-links a {
            text-decoration: none;
            color: var(--muted);
            transition: color 150ms ease;
        }
        .footer-links a:hover {
            color: var(--indigo);
            text-decoration: underline;
        }
        .footer-credits {
            font-size: 13px;
            color: var(--ink);
            font-weight: 600;
        }
        .footer-disclaimer {
            grid-column: 1 / -1;
            border-top: 1px solid var(--line);
            padding-top: 20px;
            margin-top: 8px;
            font-size: 11px;
            line-height: 1.6;
        }

        @media (max-width: 900px) {
            .hero-grid, .tool-panel { grid-template-columns: 1fr; }
            .hero-grid { text-align: center; }
            .lead { margin-left: auto; margin-right: auto; }
            .hero-actions { justify-content: center; }
            .device-stage { min-height: 410px; }
            .screen { min-height: 410px; }
            .schedule-row { grid-template-columns: 1fr; gap: 6px; }
            .schedule-time { white-space: normal; }
            .panel-card p { min-height: auto; }
            .help { min-height: auto; }
        }
        @media (max-width: 560px) {
            .wrap, .nav-inner, .subnav-inner { width: min(100% - 24px, 1120px); }
            .nav-links a:nth-child(n+3), .sub-actions .text-link { display: none; }
            .nav-links { gap: 16px; }
            .hero { padding-top: 44px; }
            h1 { font-size: 44px; }
            .lead { font-size: 22px; }
            .section { padding: 62px 0; }
            .input-row { flex-direction: column; align-items: stretch; }
            .pill { width: 100%; }
            .mini-row { grid-template-columns: 44px 1fr; }
            .mini-state { grid-column: 2; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module" src="/assets/app.js"></script>
</body>
</html>
